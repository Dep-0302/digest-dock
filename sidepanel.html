<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigestDock</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="stylesheet" href="ui-themes.css" />
    <script src="ui-themes.js"></script>
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "DigestDock" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <div class="header-actions">
          <div
            class="language-mode-control transcript-mode-control"
            id="transcriptModeControl"
            role="group"
            aria-label="字幕语言"
            hidden
          >
            <button
              class="language-mode-btn transcript-mode-btn active"
              type="button"
              data-transcript-mode="original"
              aria-pressed="true"
            >原文</button>
            <button
              class="language-mode-btn transcript-mode-btn"
              type="button"
              data-transcript-mode="zh"
              aria-pressed="false"
            >中文</button>
            <button
              class="language-mode-btn transcript-mode-btn"
              type="button"
              data-transcript-mode="bilingual"
              aria-pressed="false"
            >双语</button>
            <span
              class="translation-spinner"
              id="langSpinner"
              aria-label="正在翻译"
            ></span>
          </div>
          <div
            class="language-mode-control overview-mode-control"
            id="overviewModeControl"
            role="group"
            aria-label="概览语言"
            hidden
          >
            <button
              class="language-mode-btn overview-mode-btn"
              type="button"
              data-overview-mode="original"
              aria-pressed="false"
            >原文</button>
            <button
              class="language-mode-btn overview-mode-btn active"
              type="button"
              data-overview-mode="zh"
              aria-pressed="true"
            >中文</button>
            <button
              class="language-mode-btn overview-mode-btn"
              type="button"
              data-overview-mode="bilingual"
              aria-pressed="false"
            >双语</button>
            <span
              class="translation-spinner"
              id="overviewLangSpinner"
              aria-label="正在生成原文概览"
            ></span>
          </div>
          <div
            class="language-mode-control notes-mode-control"
            id="notesModeControl"
            role="group"
            aria-label="笔记语言"
            hidden
          >
            <button
              class="language-mode-btn notes-mode-btn"
              type="button"
              data-notes-mode="original"
              aria-pressed="false"
            >原文</button>
            <button
              class="language-mode-btn notes-mode-btn"
              type="button"
              data-notes-mode="zh"
              aria-pressed="false"
            >中文</button>
            <button
              class="language-mode-btn notes-mode-btn active"
              type="button"
              data-notes-mode="bilingual"
              aria-pressed="true"
            >双语</button>
            <span
              class="translation-spinner"
              id="notesLangSpinner"
              aria-label="正在生成中文笔记"
            ></span>
          </div>
          <div class="theme-switch">
            <button
              class="settings-btn theme-switch-btn"
              id="themeSwitchBtn"
              type="button"
              title="界面主题"
              aria-label="界面主题"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="themeSwitchMenu"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path>
              </svg>
            </button>
            <div
              class="theme-switch-menu"
              id="themeSwitchMenu"
              role="menu"
              aria-label="选择界面主题"
              hidden
            >
              <button
                class="theme-option"
                type="button"
                role="menuitemradio"
                aria-checked="true"
                data-theme-id="classic"
              >
                <span class="theme-swatch theme-swatch--classic" aria-hidden="true"></span>
                <span class="theme-option-label">经典工作台</span>
                <span class="theme-option-check" aria-hidden="true">✓</span>
              </button>
              <button
                class="theme-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-theme-id="ink-night"
              >
                <span class="theme-swatch theme-swatch--night" aria-hidden="true"></span>
                <span class="theme-option-label">墨夜</span>
                <span class="theme-option-check" aria-hidden="true">✓</span>
              </button>
              <button
                class="theme-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-theme-id="warm-paper"
              >
                <span class="theme-swatch theme-swatch--paper" aria-hidden="true"></span>
                <span class="theme-option-label">暖纸</span>
                <span class="theme-option-check" aria-hidden="true">✓</span>
              </button>
            </div>
          </div>
          <button
            class="settings-btn"
            id="settingsBtn"
            type="button"
            title="打开 DigestDock 设置"
            aria-label="打开 DigestDock 设置"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Tab navigation -->
      <div class="tabs"
        id="tabsNav"
        role="tablist"
        aria-label="当前视频工作区"
        style="display: none"
      >
        <button
          class="tab active"
          id="transcriptTab"
          type="button"
          role="tab"
          data-tab="transcript"
          aria-controls="transcriptPanel"
          aria-selected="true"
        >字幕</button>
        <button
          class="tab"
          id="overviewTab"
          type="button"
          role="tab"
          data-tab="overview"
          aria-controls="overviewPanel"
          aria-selected="false"
        >概览</button>
        <button
          class="tab"
          id="notesTab"
          type="button"
          role="tab"
          data-tab="notes"
          aria-controls="notesPanel"
          aria-selected="false"
        >笔记</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon" aria-hidden="true">
          <svg viewBox="0 0 128 128" role="img" aria-label="DigestDock">
            <rect x="24" y="32" width="80" height="16" rx="8" fill="#FFFFFF"></rect>
            <circle cx="32" cy="64" r="8" fill="#D8F7FF"></circle>
            <rect x="48" y="56" width="56" height="16" rx="8" fill="#FFFFFF"></rect>
            <rect x="40" y="80" width="56" height="16" rx="8" fill="#FFFFFF"></rect>
          </svg>
        </div>
        <div class="welcome-title">准备开始</div>
        <div class="welcome-desc">
          打开 YouTube 或带字幕的 B 站视频，即可免费阅读字幕、跳转时间点并保存原文笔记。概览、讲解和翻译按需启用。
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText">正在获取字幕</div>
          <div class="loading-subtext" id="loadingSubtext">
            正在从视频中提取字幕…
          </div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container" role="status" aria-live="polite">
          <div class="error-icon">&#9888;</div>
          <div class="error-title" id="errorTitle">出错了</div>
          <div class="error-message" id="errorMessage">
            操作未能完成。
          </div>
          <div class="error-actions">
            <button class="error-btn" id="errorBtn" type="button">重试</button>
            <button
              class="error-secondary-btn"
              id="errorSecondaryBtn"
              type="button"
              hidden
            >
              不使用
            </button>
          </div>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div
          class="tab-panel active"
          id="transcriptPanel"
          role="tabpanel"
          aria-labelledby="transcriptTab"
          data-panel="transcript"
        >
          <div
            class="workspace-state-region"
            id="transcriptStateRegion"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            aria-busy="false"
            hidden
          ></div>
          <div class="section transcript-ready-region" id="transcriptReadyRegion">
            <div class="section-header transcript-section-header">
              <div class="section-title">完整字幕</div>
              <div class="transcript-actions">
                <button
                  class="icon-btn"
                  id="copyTranscriptBtn"
                  type="button"
                  title="复制完整字幕"
                  aria-label="复制完整字幕"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                </button>
                <button
                  class="icon-btn"
                  id="exportTranscriptBtn"
                  type="button"
                  title="导出完整字幕"
                  aria-label="导出完整字幕"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div
              class="notes-export-precheck transcript-export-precheck"
              id="transcriptExportPrecheck"
              role="group"
              aria-label="字幕导出预检"
              hidden
            ></div>
            <p
              class="notes-export-status"
              id="transcriptExportStatus"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <p
              class="transcript-translation-status"
              id="transcriptTranslationStatus"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div
          class="tab-panel"
          id="overviewPanel"
          role="tabpanel"
          aria-labelledby="overviewTab"
          data-panel="overview"
        >
          <p
            class="overview-translation-status"
            id="overviewTranslationStatus"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <!-- Chapters -->
          <div class="section">
            <div class="section-title">章节</div>
            <ul class="chapter-list" id="chapterList">
              <li
                class="chapter-item"
                style="
                  color: var(--text-muted);
                  cursor: default;
                  border-color: var(--border);
                "
              >
                章节会显示在这里
              </li>
            </ul>
          </div>

          <!-- Key Quotes -->
          <div class="section">
            <div class="section-title">关键语句</div>
            <div id="quotesList">
              <div
                class="quote-item"
                style="
                  color: var(--text-muted);
                  border-left-color: var(--border);
                  cursor: default;
                "
              >
                <div class="quote-text" style="font-style: normal">
                  打开此标签页后会提取关键语句…
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div
          class="tab-panel"
          id="notesPanel"
          role="tabpanel"
          aria-labelledby="notesTab"
          data-panel="notes"
        >
          <div class="section">
            <div class="section-header">
              <div class="section-title">已保存的笔记</div>
              <div class="notes-header-actions">
                <div class="notes-filter">
                  <button
                    class="enhance-btn active"
                    id="notesFilterThis"
                    aria-pressed="true"
                  >
                    当前视频
                  </button>
                  <button
                    class="enhance-btn"
                    id="notesFilterAll"
                    aria-pressed="false"
                  >
                    全部笔记
                  </button>
                </div>
                <div class="notes-export" id="notesExport">
                  <button
                    class="enhance-btn"
                    id="notesExportBtn"
                    type="button"
                    aria-haspopup="menu"
                    aria-expanded="false"
                    aria-controls="notesExportMenu notesExportPicker"
                  >
                    导出笔记
                  </button>
                  <div
                    class="notes-export-menu"
                    id="notesExportMenu"
                    role="menu"
                    aria-label="导出笔记"
                    hidden
                  >
                    <button
                      class="notes-export-item"
                      id="exportCurrentNotes"
                      type="button"
                      role="menuitem"
                    >
                      导出当前视频
                    </button>
                    <button
                      class="notes-export-item"
                      id="selectNotesForExport"
                      type="button"
                      role="menuitem"
                      hidden
                    >
                      选择视频导出…
                    </button>
                    <button
                      class="notes-export-item"
                      id="exportAllNotes"
                      type="button"
                      role="menuitem"
                      hidden
                    >
                      导出全部视频
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <form
              class="notes-export-picker"
              id="notesExportPicker"
              aria-labelledby="notesExportPickerLegend"
              hidden
            >
              <fieldset>
                <legend id="notesExportPickerLegend">
                  <span>选择要导出的视频</span>
                  <span
                    class="notes-export-selection-count"
                    id="notesExportSelectionCount"
                    aria-live="polite"
                  >已选 0/0</span>
                </legend>
                <label class="notes-export-select-all">
                  <input id="notesExportSelectAll" type="checkbox" />
                  <span>全选</span>
                </label>
                <div
                  class="notes-export-picker-list"
                  id="notesExportPickerList"
                ></div>
                <p
                  class="notes-export-picker-disclosure"
                  id="notesExportPickerDisclosure"
                  aria-live="polite"
                >选择视频后将显示导出准备情况。</p>
                <div class="notes-export-picker-actions">
                  <button
                    class="enhance-btn notes-export-cancel"
                    id="cancelNotesExportSelection"
                    type="button"
                  >
                    取消
                  </button>
                  <button
                    class="enhance-btn"
                    id="directNotesExportSelection"
                    type="button"
                    disabled
                  >
                    直接导出（0）
                  </button>
                  <button
                    class="enhance-btn active"
                    id="confirmNotesExportSelection"
                    type="submit"
                    disabled
                  >
                    完整导出（0）
                  </button>
                </div>
              </fieldset>
            </form>
            <div
              class="notes-export-precheck"
              id="notesExportPrecheck"
              role="group"
              aria-label="导出预检"
              hidden
            ></div>
            <p
              class="notes-export-status"
              id="notesExportStatus"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <div class="notes-intro" id="notesIntro">
              <p id="notesIntroText">
                保存当前播放位置，稍后可从笔记直接跳回视频。
              </p>
              <button
                class="enhance-btn notes-save-current"
                id="saveCurrentMomentBtn"
                type="button"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V22l-6-3.5L6 22z"></path>
                  <path d="M12 7v6M9 10h6"></path>
                </svg>
                <span>保存当前时刻</span>
              </button>
            </div>
            <p
              class="notes-language-status"
              id="notesLanguageStatus"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <div id="notesList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      type="button"
      style="display: none"
      aria-label="跟随视频并回到当前播放位置"
    >
      跟随视频
    </button>

    <script src="bilibili.js"></script>
    <script src="settings.js"></script>
    <script src="note-export.js"></script>
    <script src="note-sources.js"></script>
    <script src="export-jobs.js"></script>
    <script src="sidepanel-state.js"></script>
    <script src="sidepanel-effects.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>

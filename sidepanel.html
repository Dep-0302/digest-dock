<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigestDock</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "DigestDock" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <div class="header-actions">
          <div
            class="language-mode-control transcript-mode-control"
            id="transcriptModeControl"
            role="group"
            aria-label="字幕语言"
            hidden
          >
            <button
              class="language-mode-btn transcript-mode-btn active"
              type="button"
              data-transcript-mode="original"
              aria-pressed="true"
            >原文</button>
            <button
              class="language-mode-btn transcript-mode-btn"
              type="button"
              data-transcript-mode="zh"
              aria-pressed="false"
            >中文</button>
            <button
              class="language-mode-btn transcript-mode-btn"
              type="button"
              data-transcript-mode="bilingual"
              aria-pressed="false"
            >双语</button>
            <span
              class="translation-spinner"
              id="langSpinner"
              aria-label="正在翻译"
            ></span>
          </div>
          <div
            class="language-mode-control overview-mode-control"
            id="overviewModeControl"
            role="group"
            aria-label="概览语言"
            hidden
          >
            <button
              class="language-mode-btn overview-mode-btn"
              type="button"
              data-overview-mode="original"
              aria-pressed="false"
            >原文</button>
            <button
              class="language-mode-btn overview-mode-btn active"
              type="button"
              data-overview-mode="zh"
              aria-pressed="true"
            >中文</button>
            <button
              class="language-mode-btn overview-mode-btn"
              type="button"
              data-overview-mode="bilingual"
              aria-pressed="false"
            >双语</button>
            <span
              class="translation-spinner"
              id="overviewLangSpinner"
              aria-label="正在生成原文概览"
            ></span>
          </div>
          <div
            class="language-mode-control notes-mode-control"
            id="notesModeControl"
            role="group"
            aria-label="笔记语言"
            hidden
          >
            <button
              class="language-mode-btn notes-mode-btn"
              type="button"
              data-notes-mode="original"
              aria-pressed="false"
            >原文</button>
            <button
              class="language-mode-btn notes-mode-btn"
              type="button"
              data-notes-mode="zh"
              aria-pressed="false"
            >中文</button>
            <button
              class="language-mode-btn notes-mode-btn active"
              type="button"
              data-notes-mode="bilingual"
              aria-pressed="true"
            >双语</button>
            <span
              class="translation-spinner"
              id="notesLangSpinner"
              aria-label="正在生成中文笔记"
            ></span>
          </div>
          <button
            class="settings-btn"
            id="settingsBtn"
            type="button"
            title="打开 DigestDock 设置"
            aria-label="打开 DigestDock 设置"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Tab navigation -->
      <div class="tabs" id="tabsNav" style="display: none">
        <button class="tab active" data-tab="transcript">字幕</button>
        <button class="tab" data-tab="overview">概览</button>
        <button class="tab" data-tab="notes">笔记</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon" aria-hidden="true">
          <svg viewBox="0 0 128 128" role="img" aria-label="DigestDock">
            <rect x="24" y="32" width="80" height="16" rx="8" fill="#FFFFFF"></rect>
            <circle cx="32" cy="64" r="8" fill="#F26A4F"></circle>
            <rect x="48" y="56" width="56" height="16" rx="8" fill="#FFFFFF"></rect>
            <rect x="40" y="80" width="56" height="16" rx="8" fill="#FFFFFF"></rect>
          </svg>
        </div>
        <div class="welcome-title">准备开始</div>
        <div class="welcome-desc">
          打开一个 YouTube 或带字幕的 B 站视频并点击扩展图标，即可生成 AI 学习摘要。
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText">正在获取字幕</div>
          <div class="loading-subtext" id="loadingSubtext">
            正在从视频中提取字幕…
          </div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container" role="status" aria-live="polite">
          <div class="error-icon">&#9888;</div>
          <div class="error-title" id="errorTitle">出错了</div>
          <div class="error-message" id="errorMessage">
            操作未能完成。
          </div>
          <div class="error-actions">
            <button class="error-btn" id="errorBtn" type="button">重试</button>
            <button
              class="error-secondary-btn"
              id="errorSecondaryBtn"
              type="button"
              hidden
            >
              不使用
            </button>
          </div>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div class="tab-panel active" data-panel="transcript">
          <div class="section">
            <div class="section-header transcript-section-header">
              <div class="section-title">完整字幕</div>
              <div class="transcript-actions">
                <button
                  class="icon-btn"
                  id="copyTranscriptBtn"
                  type="button"
                  title="复制完整字幕"
                  aria-label="复制完整字幕"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                </button>
                <button
                  class="icon-btn"
                  id="exportTranscriptBtn"
                  type="button"
                  title="导出完整字幕"
                  aria-label="导出完整字幕"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div class="tab-panel" data-panel="overview">
          <p
            class="overview-translation-status"
            id="overviewTranslationStatus"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <!-- Chapters -->
          <div class="section">
            <div class="section-title">章节</div>
            <ul class="chapter-list" id="chapterList">
              <li
                class="chapter-item"
                style="
                  color: var(--text-muted);
                  cursor: default;
                  border-color: var(--border);
                "
              >
                章节会显示在这里
              </li>
            </ul>
          </div>

          <!-- Key Quotes -->
          <div class="section">
            <div class="section-title">关键语句</div>
            <div id="quotesList">
              <div
                class="quote-item"
                style="
                  color: var(--text-muted);
                  border-left-color: var(--border);
                  cursor: default;
                "
              >
                <div class="quote-text" style="font-style: normal">
                  打开此标签页后会提取关键语句…
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div class="tab-panel" data-panel="notes">
          <div class="section">
            <div class="section-header">
              <div class="section-title">已保存的笔记</div>
              <div class="notes-filter">
                <button
                  class="enhance-btn active"
                  id="notesFilterThis"
                  aria-pressed="true"
                >
                  当前视频
                </button>
                <button
                  class="enhance-btn"
                  id="notesFilterAll"
                  aria-pressed="false"
                >
                  全部笔记
                </button>
              </div>
            </div>
            <p class="notes-intro" id="notesIntro">
              将鼠标移到视频上，点击书签图标即可保存带时间戳的笔记；也可以在
              视频获得焦点时按 N 键。
            </p>
            <p
              class="notes-language-status"
              id="notesLanguageStatus"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <div id="notesList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      type="button"
      style="display: none"
      aria-label="回到当前播放位置"
    >
      回到 <span class="follow-time" id="followPlaybackTime"></span>
    </button>

    <script src="bilibili.js"></script>
    <script src="settings.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>

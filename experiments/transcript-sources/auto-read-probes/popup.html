<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DigestDock Auto-read Probe</title>
    <style>
      body { width: 340px; margin: 0; padding: 16px; font: 13px/1.5 system-ui, sans-serif; color: #17212b; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      label { display: grid; gap: 5px; margin-bottom: 12px; }
      input { padding: 8px; border: 1px solid #cbd5df; border-radius: 8px; }
      button { padding: 9px 12px; border: 0; border-radius: 8px; background: #076dd1; color: white; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: 0.55; cursor: default; }
      pre { min-height: 120px; margin: 12px 0 0; padding: 10px; overflow: auto; border-radius: 8px; background: #f3f6f8; white-space: pre-wrap; word-break: break-word; }
      .note { color: #5a6875; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>单 IOS / 单 json3 探针</h1>
    <p class="note">只返回语言、轨道、失败阶段、请求数、状态、字节和段数；不显示或保存字幕正文与临时地址。</p>
    <label>目标语言 <input id="language" value="zh" maxlength="20" /></label>
    <button id="run" type="button">验证当前视频</button>
    <pre id="output">尚未运行</pre>
    <script src="popup.js"></script>
  </body>
</html>
